name: C-Trace CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, types, tests (Python 3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          enable-cache: true
      - name: Install (frozen lockfile)
        run: uv sync --all-packages --all-extras --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy
      - name: Retrain C-Trace Verifier (must reproduce the committed headline metrics)
        run: |
          git show HEAD:models/ctrace-verifier/v2/metrics.json > /tmp/committed_metrics.json
          uv run python ml/train.py > /dev/null
          uv run python ml/check_reproducible.py /tmp/committed_metrics.json
      - name: Tests
        run: uv run pytest
      - name: requirements.txt matches uv.lock
        run: |
          uv export --frozen --no-hashes --no-dev --all-packages --all-extras --format requirements-txt -o /tmp/req.txt
          diff -u <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/req.txt)  # the header names the output path

  web:
    name: Web app (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: docker compose -f infra/docker-compose.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: c-trace:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
