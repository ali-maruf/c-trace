name: C-Trace CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, types, tests (Python 3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          enable-cache: true
      - name: Install (frozen lockfile)
        run: uv sync --all-packages --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy
      - name: Retrain C-Trace Verifier (checks the model card is reproducible)
        run: uv run python ml/train.py > /dev/null
      - name: Tests
        run: uv run pytest
      - name: requirements.txt matches uv.lock
        run: |
          uv export --frozen --no-hashes --no-dev --all-packages --format requirements-txt -o /tmp/req.txt
          diff -u requirements.txt /tmp/req.txt

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: docker compose -f infra/docker-compose.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: c-trace:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
