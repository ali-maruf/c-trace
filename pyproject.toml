[project]
name = "c-trace"
version = "0.1.0"
description = "C-Trace — Trace every tonne. Verifiable carbon MRV for factories. Workspace root."
requires-python = ">=3.12,<3.13"
dependencies = [
    "ctrace",
    "ctrace-api",
    "ctrace-worker",
    "pandera==0.36.0",
]

[project.optional-dependencies]
# apps/demo-streamlit (hackathon offline fallback). An extra, so the hosted API bundle stays under Vercel's 500 MB.
demo = [
    "streamlit>=1.67,<2",
    "plotly>=7.1,<8",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "httpx>=0.28",
    "ruff>=0.14",
    "mypy>=1.18",
    "hypothesis>=6.100",
    "pgserver>=0.1.4",   # embedded Postgres 16 + pgvector for local dev and tests (no Docker needed)
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/ctrace", "services/api", "services/worker"]

[tool.uv.sources]
ctrace = { workspace = true }
ctrace-api = { workspace = true }
ctrace-worker = { workspace = true }

# ---------------------------------------------------------------- tooling
[tool.pytest.ini_options]
testpaths = ["packages/ctrace/tests", "services/api/tests", "services/worker/tests", "apps/demo-streamlit/tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# E501: prototype uses long, readable one-line f-strings; reflowing them is churn, not a fix.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ctrace", "ctrace_api", "ctrace_worker"]

[tool.mypy]
python_version = "3.12"
files = ["packages/ctrace/ctrace", "services/api/ctrace_api", "services/worker/ctrace_worker"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
