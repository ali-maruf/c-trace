[project]
name = "ctrace-api"
version = "0.1.0"
description = "C-Trace REST API (FastAPI) wrapping the ctrace core."
requires-python = ">=3.12,<3.13"
dependencies = [
    "ctrace[db]",
    "pyjwt[crypto]>=2.10,<3",
    "psycopg-pool>=3.2,<4",
    "fastapi>=0.165,<1",
    "uvicorn[standard]>=0.54,<1",
    "python-multipart>=0.0.34",
]

[tool.uv.sources]
ctrace = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ctrace_api"]
