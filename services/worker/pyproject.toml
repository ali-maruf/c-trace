[project]
name = "ctrace-worker"
version = "0.1.0"
description = "C-Trace background worker: runs extraction and ledger jobs from the Postgres jobs table."
requires-python = ">=3.12,<3.13"
dependencies = ["ctrace[db]"]

[project.scripts]
ctrace-worker = "ctrace_worker.__main__:main"

[tool.uv.sources]
ctrace = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ctrace_worker"]
