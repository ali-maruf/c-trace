[project]
name = "ctrace"
version = "0.1.0"
description = "C-Trace core: extraction, deterministic emissions ledger, C-Trace Verifier, reduction proof and C-Trace Reports."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5,<3",
    "pandas>=3.1,<4",
    "scikit-learn>=1.9,<1.10",   # the pickled C-Trace Verifier is tied to this minor version
    "scipy>=1.18,<2",
    "joblib>=1.6,<2",
    "pdfplumber>=0.11.10,<0.12",
    "reportlab>=5.1,<6",
    "anthropic>=2.10,<3",
]

[project.optional-dependencies]
# ctrace.store: Postgres persistence, job queue, seed (used by the API and worker)
db = [
    "psycopg[binary]>=3.3,<4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ctrace"]
