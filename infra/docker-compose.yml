# C-Trace local stack: Postgres (pgvector) + API + worker + Streamlit fallback.
#   docker compose -f infra/docker-compose.yml up --build
#   docker compose -f infra/docker-compose.yml run --rm seed     # load the fictional demo factory
# API docs: http://localhost:8000/docs · Streamlit: http://localhost:8501
# Development tokens (make dev-token) work because CTRACE_ENV=development and .secrets/ is mounted.
name: c-trace

x-app: &app
  build:
    context: ..
  environment: &env
    DATABASE_URL: postgresql://ctrace:${CTRACE_DB_PASSWORD:-ctrace-local-only}@db:5432/ctrace
    CTRACE_ENV: development
    CTRACE_STORAGE_DIR: /data/storage
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  volumes:
    - storage:/data/storage
    - ../.secrets:/app/.secrets:ro
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ctrace
      POSTGRES_PASSWORD: ${CTRACE_DB_PASSWORD:-ctrace-local-only}
      POSTGRES_DB: ctrace
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctrace -d ctrace"]
      interval: 2s
      retries: 30

  api:
    <<: *app
    command: ["uvicorn", "ctrace_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *env
      CTRACE_MIGRATE_ON_START: "1"
    ports: ["8000:8000"]

  worker:
    <<: *app
    command: ["python", "-m", "ctrace_worker"]

  seed:
    <<: *app
    command: ["python", "-m", "ctrace.store.seed"]
    profiles: ["tools"]

  streamlit:
    <<: *app
    ports: ["8501:8501"]

volumes:
  pgdata:
  storage:
